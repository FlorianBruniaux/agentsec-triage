  - id: github-ghsa-5gm3-9crp-6g3v
    title: 'CVE-2026-77339: github.com/f1bonacc1/process-compose'
    publisher: GitHub Advisory Database and upstream maintainers
    url: https://github.com/advisories/GHSA-5gm3-9crp-6g3v
    source_type: advisory
    published_date: '2026-09-18'
    topics:
    - mcp
    - agent-security
    supports:
    - When MCP SSE is enabled, browser DNS rebinding can reach Process Compose tools. The separate
