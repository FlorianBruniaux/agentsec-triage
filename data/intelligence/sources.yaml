    source_type: advisory
    published_date: '2026-10-02'
    topics:
    - mcp
    - python
    supports:
    - HTTP client transports and OAuth requests followed cross-origin redirects carrying custom headers
      and, for 307/308, request bodies. The HTTP library dropped a lone Authorization header across
      origins.
    - 'Affected: mcp >= 1.8.0, < 1.30.0; >= 2.0.0, < 2.2.0. Patched: 1.x: 1.30.0; 2.x: 2.2.0.'
    reviewed_date: '2026-10-04'
    status: active
  - id: review-2026-10-ghsa-fmmv-w9g8-j3gc
