  - id: github-ghsa-mcp-php-sdk-sse-2026
    title: "DoS: client HttpTransport SSE buffer (sseBuffer .= chunk) grows unbounded when server withholds the event delimiter"
    publisher: modelcontextprotocol/php-sdk (GitHub Security Advisory)
    url: https://github.com/modelcontextprotocol/php-sdk/security/advisories/GHSA-7m52-jw36-44r3
    source_type: advisory
    topics: [mcp, denial-of-service, php-sdk]
    supports:
      - "The official MCP PHP SDK (Composer package mcp/sdk) HttpTransport component appends every incoming Server-Sent Events chunk to an unbounded in-memory buffer, flushing only on the SSE event delimiter, so a malicious, compromised, or man-in-the-middle MCP server that withholds the delimiter can exhaust the client process's memory and deny service."
      - Fixed in mcp/sdk 0.7.1; affected versions 0.5.0 through 0.7.0.
    reviewed_date: "2026-09-01"
    status: active

