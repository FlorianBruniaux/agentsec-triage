updated: "2026-09-24"
sources:
  - id: review-2026-09-cve-2026-90999
    title: Sentry Seer fabricated-event code execution
    publisher: CERT/CC
    url: https://www.kb.cert.org/vuls/id/212479
    source_type: advisory
    published_date: '2026-09-16'
    topics:
    - agent-security
    supports:
    - CERT/CC describes untrusted public-DSN events becoming coding-agent instructions when automatic
      remediation is enabled, leading to execution in the agent environment and access to connected
      repositories.
    - 'Reviewed remediation: Pause automatic coding-agent handoff, restrict package installation and
      scope repository credentials while awaiting vendor remediation.'
    reviewed_date: '2026-09-24'
    status: active
  - id: review-2026-09-advisory-plugin4shell-2026-001
    title: Plugin4Shell plugin pin verification bypass
    publisher: AIR Security
    url: https://www.air.security/blog-posts/plugin4shell
    source_type: research
    published_date: '2026-09-17'
    topics:
    - agent-security
    supports:
    - AIR reports plugin checkout can resolve an attacker-controlled default branch instead of the
      reviewed commit. The SHA-shaped branch variant depends on Git host rules; Gemini uses a FETCH_HEAD
      variant.
    - 'Reviewed remediation: AIR reports fixes in Claude Code 2.1.179 and Codex 0.146.0. For other
      affected installers, verify current vendor guidance or disable affected plugin updates.'
    reviewed_date: '2026-09-24'
    status: active
  - id: review-2026-09-advisory-codex-2026-001
    title: Overpatch sandbox write-boundary escape
    publisher: Accomplish AI
    url: https://www.accomplish.ai/blog/escaping-the-openai-codex-sandbox-twice/
    source_type: research
    published_date: '2026-09-15'
    topics:
    - agent-security
    supports:
    - Accomplish reported that attacker-controlled patch paths could expand write authorization beyond
      the Codex workspace. The researcher identifies CLI 0.149.0 as fixed.
    - 'Reviewed remediation: Update Codex CLI to 0.149.0 or later.'
    - Accomplish reported that a Desktop-installed JavaScript helper exposed a privileged trust token
      within shared memory, enabling host execution even in read-only mode. The researcher identifies
      Desktop build 26.818.21641 as fixed.
    - 'Reviewed remediation: Update Codex Desktop to build 26.818.21641 or later; a CLI-only update
      does not establish that the Desktop helper is patched.'
    reviewed_date: '2026-09-24'
    status: active
  - id: review-2026-09-advisory-cc-2026-004
    title: Claude Code late-September permission fixes
    publisher: Anthropic
    url: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
    source_type: maintainer
    published_date: '2026-09-23'
    topics:
    - agent-security
    supports:
    - Releases through 2.1.281 correct symlink write checks, workspace trust before background hooks,
      inherited setting restrictions, NUL permission rules and managed MCP handling.
    - 'Reviewed remediation: Update Claude Code to 2.1.281 or later and review trust, permission and
      managed MCP settings.'
    reviewed_date: '2026-09-24'
    status: active
  - id: github-ghsa-5648-rgj9-v224
    title: 'GHSA-5648-rgj9-v224: @zereight/mcp-gitlab'
    publisher: GitHub Advisory Database and upstream maintainers
    url: https://github.com/advisories/GHSA-5648-rgj9-v224
    source_type: advisory
    published_date: '2026-09-15'
    topics:
    - mcp
    - agent-security
    supports:
    - GraphQL operations can bypass read-only and project filters. Other findings concern deployment-dependent
      transport authentication, session exhaustion and untrusted CI logs.
    - 'Advisory metadata lists @zereight/mcp-gitlab < 2.1.30; patched: 2.1.30.'
    reviewed_date: '2026-09-24'
    status: active
  - id: github-ghsa-vmp7-252j-cwp7
    title: 'CVE-2026-61568: @zereight/mcp-gitlab'
    publisher: GitHub Advisory Database and upstream maintainers
    url: https://github.com/advisories/GHSA-vmp7-252j-cwp7
    source_type: advisory
    published_date: '2026-09-15'
    topics:
    - mcp
    - agent-security
    supports:
    - Streamable HTTP accepts attacker-origin browser traffic at initialization. In remote-authorization
      mode, tool listing and GitLab calls still require a token; the advisory does not establish a
      tokenless takeover in that mode.
    - 'Advisory metadata lists @zereight/mcp-gitlab < 2.1.30; patched: 2.1.30.'
    reviewed_date: '2026-09-24'
    status: active
  - id: github-ghsa-2h44-8472-frjj
    title: 'CVE-2026-61559: @zereight/mcp-gitlab'
    publisher: GitHub Advisory Database and upstream maintainers
    url: https://github.com/advisories/GHSA-2h44-8472-frjj
    source_type: advisory
    published_date: '2026-09-15'
    topics:
    - mcp
    - agent-security
    supports:
    - With ENABLE_DYNAMIC_API_URL=true, an HTTP caller can redirect credential-bearing GitLab requests
      through X-GitLab-API-URL to an untrusted destination.
    - 'Advisory metadata lists @zereight/mcp-gitlab >= 0.0.1, < 2.1.27; patched: 2.1.27.'
    reviewed_date: '2026-09-24'
    status: active
  - id: github-ghsa-cv3r-c5h8-f4g5
    title: 'CVE-2026-61560: @zereight/mcp-gitlab'
