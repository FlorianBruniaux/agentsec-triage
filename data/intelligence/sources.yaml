    url: https://github.com/modelcontextprotocol/python-sdk/security/advisories/GHSA-fmmv-w9g8-j3gc
    source_type: advisory
    published_date: '2026-09-30'
    topics:
    - mcp
    - python
    supports:
    - HTTP transports and OAuth routes read request bodies without a shared size limit. Streamable HTTP
      received an earlier partial limit; the later fix covered SSE message and OAuth routes.
    - 'Affected: mcp < 1.29.1; >= 2.0.0, < 2.1.0. Patched: 1.x: 1.29.1; 2.x: 2.1.0.'
    reviewed_date: '2026-10-04'
    status: active
  - id: review-2026-10-ghsa-84m7-p3x7-pcfv
