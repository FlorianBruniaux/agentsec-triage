    url: https://github.com/siyuan-note/siyuan/security/advisories/GHSA-p23f-cm6q-2qp8
    source_type: advisory
    published_date: "2026-08-13"
    topics: [mcp, path-traversal, prompt-injection]
    supports:
      - "The asset.upload MCP tool in SiYuan before v3.8.1 accepted arbitrary absolute file paths with no workspace boundary check, so a prompt-injected instruction could direct the built-in AI agent to copy files such as SSH keys or credentials from outside the workspace into the asset directory."
