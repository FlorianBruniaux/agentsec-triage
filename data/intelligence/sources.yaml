    source_type: advisory
    published_date: '2026-09-16'
    topics:
    - agent-security
    supports:
    - CERT/CC describes untrusted public-DSN events becoming coding-agent instructions when automatic
      remediation is enabled, leading to execution in the agent environment and access to connected
      repositories.
    - 'Reviewed remediation: Pause automatic coding-agent handoff, restrict package installation and
      scope repository credentials while awaiting vendor remediation.'
    reviewed_date: '2026-09-24'
    status: active
  - id: review-2026-09-advisory-plugin4shell-2026-001
    title: Plugin4Shell plugin pin verification bypass
    publisher: AIR Security
    url: https://www.air.security/blog-posts/plugin4shell
    source_type: research
    published_date: '2026-09-17'
    topics:
    - agent-security
    supports:
    - AIR reports plugin checkout can resolve an attacker-controlled default branch instead of the
      reviewed commit. The SHA-shaped branch variant depends on Git host rules; Gemini uses a FETCH_HEAD
      variant.
    - 'Reviewed remediation: AIR reports fixes in Claude Code 2.1.179 and Codex 0.146.0. For other
      affected installers, verify current vendor guidance or disable affected plugin updates.'
    reviewed_date: '2026-09-24'
    status: active
  - id: review-2026-09-advisory-codex-2026-001
    title: Overpatch sandbox write-boundary escape
    publisher: Accomplish AI
    url: https://www.accomplish.ai/blog/escaping-the-openai-codex-sandbox-twice/
    source_type: research
    published_date: '2026-09-15'
    topics:
    - agent-security
    supports:
    - Accomplish reported that attacker-controlled patch paths could expand write authorization beyond
      the Codex workspace. The researcher identifies CLI 0.149.0 as fixed.
    - 'Reviewed remediation: Update Codex CLI to 0.149.0 or later.'
    - Accomplish reported that a Desktop-installed JavaScript helper exposed a privileged trust token
      within shared memory, enabling host execution even in read-only mode. The researcher identifies
      Desktop build 26.818.21641 as fixed.
    - 'Reviewed remediation: Update Codex Desktop to build 26.818.21641 or later; a CLI-only update
      does not establish that the Desktop helper is patched.'
    reviewed_date: '2026-09-24'
    status: active
  - id: review-2026-09-advisory-cc-2026-004
