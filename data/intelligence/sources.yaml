schema_version: "1"
kind: sources
updated: "2026-11-03"
sources:
  - id: review-2026-11-ghsa-6xpm-ggf7-wc3p
    title: mcp-remote OS command injection from an untrusted authorization endpoint
    publisher: GitHub Advisory Database
    url: https://github.com/advisories/GHSA-6xpm-ggf7-wc3p
    source_type: advisory
    published_date: '2025-07-09'
    topics:
    - mcp
    - npm
    - oauth
    supports:
    - mcp-remote was exposed to OS command injection when connecting to untrusted MCP servers, through crafted
      input in the authorization_endpoint response URL.
    - 'Affected: mcp-remote >= 0.0.5, < 0.1.16. Patched: 0.1.16.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-8q5r-mmjf-575q
    title: Claude Code Action runs MCP servers from a pull request .mcp.json
    publisher: Anthropic
    url: https://github.com/anthropics/claude-code-action/security/advisories/GHSA-8q5r-mmjf-575q
    source_type: advisory
    published_date: '2026-06-10'
    topics:
    - claude-code
    - github-actions
    - mcp
    supports:
    - The action checked out attacker-controlled PR head branches, read .mcp.json from the working directory
      and enabled all project MCP servers. A pull request carrying a malicious .mcp.json could run code
      on the Actions runner and expose workflow secrets when a privileged user triggered the action on that
      PR.
    - 'Affected: anthropics/claude-code-action < 1.0.74. Patched: 1.0.74.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-xrxf-jgv3-qmrm
    title: OpenAI Codex CLI auto-loads project MCP configuration
    publisher: GitHub Advisory Database
    url: https://github.com/advisories/GHSA-xrxf-jgv3-qmrm
    source_type: advisory
    published_date: '2026-04-14'
    topics:
    - codex
    - coding-agents
    - mcp
    supports:
    - Codex CLI 0.23.0 and earlier loaded project-local .env and .codex/config.toml files without confirmation
      when run inside a repository, so a malicious repository could embed commands that executed immediately
      through MCP configuration.
    - 'Affected: @openai/codex <= 0.23.0. Patched: not listed by the reviewed source.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-g8r9-g2v8-jv6f
    title: GitHub Copilot CLI hidden commands through bash parameter expansion
    publisher: GitHub
    url: https://github.com/github/copilot-cli/security/advisories/GHSA-g8r9-g2v8-jv6f
    source_type: advisory
    published_date: '2026-03-06'
    topics:
    - copilot
    - coding-agents
    supports:
    - The shell safety assessment classified commands using bash parameter transformation operators as read-only.
      An attacker who could influence agent commands, for example through repository files or MCP server
      responses, could execute hidden commands.
    - 'Affected: @github/copilot <= 0.0.422. Patched: 0.0.423.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-xcwh-rrwj-gxc7
    title: Cursor sensitive file protection bypass by case
    publisher: Cursor
    url: https://github.com/cursor/cursor/security/advisories/GHSA-xcwh-rrwj-gxc7
    source_type: advisory
    published_date: '2025-10-02'
    topics:
    - cursor
    - coding-agents
    - mcp
    supports:
    - Case-sensitive checks protecting sensitive files such as .cursor/mcp.json let a prompt injection modify
      them on case-insensitive filesystems and reach remote code execution.
    - 'Affected: Cursor < 1.6.23 (advisory range). Patched: 1.7.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-xg6w-rmh5-r77r
    title: Cursor code execution through .code-workspace settings
    publisher: Cursor
    url: https://github.com/cursor/cursor/security/advisories/GHSA-xg6w-rmh5-r77r
    source_type: advisory
    published_date: '2025-10-02'
    topics:
    - cursor
    - coding-agents
    supports:
    - A prompt injection that hijacked chat context could write workspace settings into a .code-workspace
      file and turn them into code execution.
    - 'Affected: Cursor < 1.7. Patched: 1.7.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-wj33-264c-j9cq
    title: Cursor CLI command injection through MCP OAuth
    publisher: Cursor
    url: https://github.com/cursor/cursor/security/advisories/GHSA-wj33-264c-j9cq
    source_type: advisory
    published_date: '2025-10-02'
    topics:
    - cursor
    - coding-agents
    - mcp
    - oauth
    supports:
    - When MCP used OAuth with an untrusted server, the server could return crafted commands during the
      exchange and reach command injection on the host with the user's privileges.
    - 'Affected: Cursor CLI < 2025.09.17-25b418f. Patched: 2025.09.17-25b418f.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-4575-fh42-7848
    title: Cursor MCP deep-link install hides the executed command
    publisher: Cursor
    url: https://github.com/cursor/cursor/security/advisories/GHSA-4575-fh42-7848
    source_type: advisory
    published_date: '2025-11-03'
    topics:
    - cursor
    - coding-agents
    - mcp
    supports:
    - A crafted MCP install deep-link bypassed the warning dialog and showed a trusted server name while
      running arbitrary commands from the link if the user accepted.
    - 'Affected: Cursor 1.7.28 (advisory range). Patched: 2.0.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-4hwr-97q3-37w2
    title: Cursor CLI Beta runs repository MCP configuration without a prompt
    publisher: Cursor
    url: https://github.com/cursor/cursor/security/advisories/GHSA-4hwr-97q3-37w2
    source_type: advisory
    published_date: '2025-11-03'
    topics:
    - cursor
    - coding-agents
    - mcp
    supports:
    - Opening a cloned repository with Cursor CLI ran the command of a malicious MCP server declared in
      .cursor/mcp.json without any warning.
    - 'Affected: Cursor CLI (Beta) < 2025.09.17-25b418f. Patched: 2025.09.17-25b418f.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-cv6g-cmxc-vw8j
    title: Zed runs MCP servers from project settings on open
    publisher: Zed Industries
    url: https://github.com/zed-industries/zed/security/advisories/GHSA-cv6g-cmxc-vw8j
    source_type: advisory
    published_date: '2025-12-17'
    topics:
    - zed
    - coding-agents
    - mcp
    supports:
    - Zed loaded MCP context server definitions from a project's .zed/settings.json, so opening a crafted
      project ran arbitrary commands with the user's privileges without further interaction.
    - 'Affected: Zed < v0.218.2-pre (including stable v0.217.2). Patched: v0.218.2-pre.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-j975-95f5-7wqh
    title: MCP Python SDK streamable HTTP crash on client exception
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/python-sdk/security/advisories/GHSA-j975-95f5-7wqh
    source_type: advisory
    published_date: '2025-07-04'
    topics:
    - mcp
    - pypi
    supports:
    - A client that deliberately triggered an exception after opening a streamable HTTP session could cause
      an uncaught ClosedResourceError and crash the server until restart.
    - 'Affected: mcp < 1.10.0. Patched: 1.10.0.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-3qhf-m339-9g5v
    title: MCP Python SDK FastMCP validation error crash
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/python-sdk/security/advisories/GHSA-3qhf-m339-9g5v
    source_type: advisory
    published_date: '2025-07-04'
    topics:
    - mcp
    - pypi
    supports:
    - Malformed requests could trigger an unhandled validation exception and leave the server returning
      500 errors until manually restarted.
    - 'Affected: mcp < 1.9.4. Patched: 1.9.4.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-w48q-cv73-mx4w
    title: MCP TypeScript SDK DNS rebinding protection disabled by default
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/typescript-sdk/security/advisories/GHSA-w48q-cv73-mx4w
    source_type: advisory
    published_date: '2025-12-02'
    topics:
    - mcp
    - npm
    - dns-rebinding
    supports:
    - HTTP-based servers did not enable DNS rebinding protection by default. A localhost server without
      authentication could receive requests from a malicious website and run tools or read resources on
      the user's behalf.
    - 'Affected: @modelcontextprotocol/sdk < 1.24.0. Patched: 1.24.0.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-wvj2-96wp-fq3f
    title: MCP Go SDK case-insensitive JSON-RPC field matching
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/go-sdk/security/advisories/GHSA-wvj2-96wp-fq3f
    source_type: advisory
    published_date: '2026-02-26'
    topics:
    - mcp
    - go
    supports:
    - The SDK parsed JSON-RPC with encoding/json, which matches keys case-insensitively and folds some Unicode
      characters. A malicious peer could send protocol messages with non-standard field names that the SDK
      still accepted, contrary to JSON-RPC 2.0.
    - 'Affected: github.com/modelcontextprotocol/go-sdk < 1.3.1. Patched: 1.3.1.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-hv2w-8mjj-jw22
    title: MCP Java SDK hardcoded wildcard CORS
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/java-sdk/security/advisories/GHSA-hv2w-8mjj-jw22
    source_type: advisory
    published_date: '2026-03-30'
    topics:
    - mcp
    - java
    supports:
    - 'The servlet SSE and streamable HTTP transports sent Access-Control-Allow-Origin: *, so a page in
      the victim''s browser could read responses from a reachable MCP server.'
    - 'Affected: io.modelcontextprotocol.sdk:mcp-core < 0.18.3; = 1.0.0; = 1.1.0. Patched: 0.x: 0.18.3;
      1.0.x: 1.0.1; 1.1.x: 1.1.1.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-g9hg-qhmf-q45m
    title: MCP Inspector XSS from an untrusted redirect URL
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/inspector/security/advisories/GHSA-g9hg-qhmf-q45m
    source_type: advisory
    published_date: '2025-09-08'
    topics:
    - mcp
    - npm
    supports:
    - The Inspector rendered a redirect URL returned by a remote MCP server. A crafted redirect could inject
      script and, through the built-in proxy, run commands on the developer machine.
    - 'Affected: @modelcontextprotocol/inspector < 0.16.6. Patched: 0.16.6.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-mxxr-jv3v-6pgc
    title: FastMCP OAuth client callback reflected XSS
    publisher: FastMCP maintainers
    url: https://github.com/PrefectHQ/fastmcp/security/advisories/GHSA-mxxr-jv3v-6pgc
    source_type: advisory
    published_date: '2025-10-29'
    topics:
    - mcp
    - pypi
    - oauth
    supports:
    - The callback page served during the client OAuth flow embedded request values such as the error parameter
      without escaping, allowing reflected cross-site scripting.
    - 'Affected: fastmcp < 2.13.0. Patched: 2.13.0.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-rj5c-58rq-j5g5
    title: FastMCP install cursor command injection on Windows
    publisher: FastMCP maintainers
    url: https://github.com/PrefectHQ/fastmcp/security/advisories/GHSA-rj5c-58rq-j5g5
    source_type: advisory
    published_date: '2025-10-29'
    topics:
    - mcp
    - pypi
    - windows
    supports:
    - fastmcp install cursor placed the server name in a deep-link opened through cmd.exe on Windows, so
      shell metacharacters in an influenced server name ran arbitrary commands.
    - 'Affected: fastmcp < 2.13.0. Patched: 2.13.0.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-5h2m-4q8j-pqpj
    title: FastMCP OAuth Proxy token reuse across MCP servers
    publisher: FastMCP maintainers
    url: https://github.com/PrefectHQ/fastmcp/security/advisories/GHSA-5h2m-4q8j-pqpj
    source_type: advisory
    published_date: '2026-03-16'
    topics:
    - mcp
    - pypi
    - oauth
    supports:
    - The OAuth Proxy ignored the client's resource parameter and issued tokens for its base_url, so a token
      obtained for one MCP server could be accepted by another behind the same proxy.
    - 'Affected: fastmcp < 2.14.2. Patched: 2.14.2.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-m8x7-r2rg-vh5g
    title: FastMCP install claude-code and gemini-cli command injection on Windows
    publisher: FastMCP maintainers
    url: https://github.com/PrefectHQ/fastmcp/security/advisories/GHSA-m8x7-r2rg-vh5g
    source_type: advisory
    published_date: '2026-03-31'
    topics:
    - mcp
    - pypi
    - windows
    supports:
    - On Windows the target CLIs often resolve to .cmd wrappers run through cmd.exe, so metacharacters in
      a server name passed to fastmcp install claude-code or gemini-cli ran commands.
    - 'Affected: fastmcp < 3.2.0. Patched: 3.2.0.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-w4q6-qw23-4rg7
    title: GitHub MCP Server unauthenticated crash on completion/complete
    publisher: GitHub
    url: https://github.com/github/github-mcp-server/security/advisories/GHSA-w4q6-qw23-4rg7
    source_type: advisory
    published_date: '2026-07-28'
    topics:
    - mcp
    - go
    - denial-of-service
    supports:
    - A completion/complete request without a ref field dereferenced nil and crashed the server before authentication,
      letting any client cause a denial of service.
    - 'Affected: github.com/github/github-mcp-server < 1.1.0. Patched: 1.1.0.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-v8vw-gw5j-w7m6
    title: MCP Registry open redirect through a protocol-relative path
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/registry/security/advisories/GHSA-v8vw-gw5j-w7m6
    source_type: advisory
    published_date: '2026-05-08'
    topics:
    - mcp
    - go
    supports:
    - The trailing-slash middleware redirected //evil.com/ to //evil.com, which browsers treat as an external
      URL.
    - 'Affected: github.com/modelcontextprotocol/registry >= 1.1.0, < 1.7.5. Patched: 1.7.5.'
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-cve-2025-34072
    title: Deprecated Slack MCP server leaks data through link unfurling
    publisher: GitHub Advisory Database (unreviewed)
    url: https://github.com/advisories/GHSA-gmx5-crwh-6vxg
    source_type: database
    published_date: '2025-07-02'
    topics:
    - mcp
    - npm
    - data-exfiltration
    supports:
    - The unreviewed advisory states that an agent using Anthropic's deprecated Slack MCP server could be
      led by untrusted data to post links embedding private data, which Slack preview bots then fetched
      from the attacker's URL without user interaction. No fixed version is listed.
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-cve-2026-19591
    title: Codex approval bypass through the PowerShell stop-parsing token
    publisher: GitHub Advisory Database (unreviewed)
    url: https://github.com/advisories/GHSA-2frj-4qr5-m2rf
    source_type: database
    published_date: '2026-09-01'
    topics:
    - codex
    - coding-agents
    - mcp
    - windows
    supports:
    - The unreviewed advisory states that Codex treated some PowerShell commands using --% as safe, so an
      attacker-prepared repository could get a file-writing Git command run without approval and alter Codex
      configuration to launch an attacker MCP server. The default macOS and Linux filesystem sandbox can
      block the write. The advisory links a fix pull request but no version.
    reviewed_date: '2026-11-03'
    status: active
  - id: review-2026-11-ghsa-5j29-h97v-84ch
    title: Claude Code write-time symlink following outside the project
    publisher: Anthropic
    url: https://github.com/anthropics/claude-code/security/advisories/GHSA-5j29-h97v-84ch
    source_type: advisory
    published_date: '2026-10-05'
    topics:
    - claude-code
    - coding-agents
    supports:
    - Claude Code checked that a target path was inside the project at permission time but re-resolved it
      at write time. An attacker with write access to a shared workspace who won the race could swap a project
      file for a symlink and redirect the write outside the project.
    - 'Affected: @anthropic-ai/claude-code < 2.1.129. Patched: 2.1.129.'
    reviewed_date: '2026-11-02'
    status: active
  - id: review-2026-11-ghsa-pq7j-f95f-qfcv
    title: Claude Code plugin commit SHA pin bypass
    publisher: Anthropic
    url: https://github.com/anthropics/claude-code/security/advisories/GHSA-pq7j-f95f-qfcv
    source_type: advisory
    published_date: '2026-10-09'
    topics:
    - claude-code
    - plugins
    supports:
    - The plugin install flow ran git checkout on a pinned commit SHA without checking that HEAD matched
      it. A plugin upstream could create a branch named like the 40-character SHA so the install resolved
      to attacker-controlled code.
    - 'Affected: @anthropic-ai/claude-code < 2.1.179. Patched: 2.1.179.'
    reviewed_date: '2026-11-02'
    status: active
  - id: review-2026-11-ghsa-4p2j-qj3c-6x84
    title: Claude Desktop Windows git executable search path
    publisher: Anthropic
    url: https://github.com/anthropics/claude-code/security/advisories/GHSA-4p2j-qj3c-6x84
    source_type: advisory
    published_date: '2026-10-13'
    topics:
    - claude-desktop
    - windows
    supports:
    - Claude Desktop on Windows launched git.exe without an absolute path, so the current working directory
      was searched first. A git.exe placed in a project directory ran when the user opened that directory.
    - 'Affected: Claude Desktop < 1.8089.0. Patched: 1.8089.0.'
    reviewed_date: '2026-11-02'
    status: active
  - id: review-2026-11-ghsa-5xjx-9qx6-jcrv
    title: Claude Code Edit tool directory swap outside the workspace
    publisher: Anthropic
    url: https://github.com/anthropics/claude-code/security/advisories/GHSA-5xjx-9qx6-jcrv
    source_type: advisory
    published_date: '2026-10-26'
    topics:
    - claude-code
    - sandbox
    supports:
    - Edit targets were validated with point-in-time path resolution. On macOS, code running inside the
      Bash sandbox could swap an in-workspace parent directory for a symlink after validation, making the
      unsandboxed Edit write a user-writable file outside the workspace.
    - 'Affected: @anthropic-ai/claude-code < 2.1.251. Patched: 2.1.251.'
    reviewed_date: '2026-11-02'
    status: active
  - id: review-2026-11-ghsa-h4mw-j7qp-8mwm
    title: Claude Agent SDK for Python resume option argument injection
    publisher: Anthropic
    url: https://github.com/anthropics/claude-agent-sdk-python/security/advisories/GHSA-h4mw-j7qp-8mwm
    source_type: advisory
    published_date: '2026-09-12'
    topics:
    - claude-agent-sdk
    - pypi
    supports:
    - The SDK passed the resume option to the Claude CLI without validation. A value starting with a dash
      could inject --mcp-config with a stdio MCP server and run a command at CLI startup, bypassing the
      SDK permission controls.
    - 'Affected: claude-agent-sdk < 0.2.121. Patched: 0.2.121.'
    reviewed_date: '2026-11-02'
    status: active
  - id: review-2026-11-ghsa-w4fh-qvv9-3v23
    title: MCP Python bearer authentication accepts tokens for another resource
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/python-sdk/security/advisories/GHSA-w4fh-qvv9-3v23
    source_type: advisory
    published_date: '2026-10-05'
    topics:
    - mcp
    - pypi
    supports:
    - Server bearer authentication could not check a token's audience. Where one authorization server issues
      tokens for several services, a token for another service was accepted.
    - 'Affected: mcp >= 1.10.0, < 1.30.0; >= 2.0.0, < 2.2.0. Patched: 1.x: 1.30.0; 2.x: 2.2.0.'
    reviewed_date: '2026-11-02'
    status: active
  - id: review-2026-11-ghsa-f897-62hf-6gxq
    title: MCP TypeScript HTTP servers without body size or batch limits
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/typescript-sdk/security/advisories/GHSA-f897-62hf-6gxq
    source_type: advisory
    published_date: '2026-10-15'
    topics:
    - mcp
    - npm
    supports:
    - HTTP-reachable servers did not limit POST body size or JSON-RPC batch length, so large requests could
      exhaust memory and one long batch could block the server. stdio servers are excluded.
    - 'Affected: @modelcontextprotocol/sdk >= 1.10.0, < 1.30.1; @modelcontextprotocol/server >= 2.0.0, <
      2.1.0; @modelcontextprotocol/node >= 2.0.0, < 2.1.0; @modelcontextprotocol/hono >= 2.0.0, < 2.0.1.
      Patched: sdk 1.x: 1.30.1; server and node 2.x: 2.1.0; hono: 2.0.1.'
    reviewed_date: '2026-11-02'
    status: active
  - id: review-2026-11-ghsa-jm63-cq47-j5jp
    title: MCP TypeScript shared server instances cross-deliver client messages
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/typescript-sdk/security/advisories/GHSA-jm63-cq47-j5jp
    source_type: advisory
    published_date: '2026-10-15'
    topics:
    - mcp
    - npm
    supports:
    - Messages were matched to connections by JSON-RPC id alone. When clients shared one stateless transport
      or one server instance, one client's responses and notifications could reach another client.
    - 'Affected: @modelcontextprotocol/server >= 2.0.0, < 2.3.0. Patched: 2.3.0.'
    reviewed_date: '2026-11-02'
    status: active
  - id: review-2026-11-ghsa-46jr-4wx8-v453
    title: MCP TypeScript tool input validation memory exhaustion
    publisher: Model Context Protocol maintainers
    url: https://github.com/modelcontextprotocol/typescript-sdk/security/advisories/GHSA-46jr-4wx8-v453
    source_type: advisory
    published_date: '2026-10-15'
    topics:
    - mcp
    - npm
    supports:
    - Servers did not limit how many array elements and object keys they validated in one request, so one
      HTTP request inside the default 4 MiB limit could exhaust the heap.
    - 'Affected: @modelcontextprotocol/sdk >= 1.3.0, < 1.32.0; @modelcontextprotocol/server >= 2.0.0, <
      2.3.0. Patched: sdk 1.x: 1.32.0; server 2.x: 2.3.0.'
    reviewed_date: '2026-11-02'
    status: active
