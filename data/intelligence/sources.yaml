    url: https://github.com/advisories/GHSA-cv3r-c5h8-f4g5
    source_type: advisory
    published_date: '2026-09-16'
    topics:
    - mcp
    - agent-security
    supports:
    - An exposed SSE transport and unrestricted upload_markdown path can disclose server-readable files,
      including GitLab tokens, to a reachable GitLab project.
    - 'Advisory metadata lists @zereight/mcp-gitlab < 2.1.27; patched: 2.1.27.'
    reviewed_date: '2026-09-24'
    status: active
  - id: github-ghsa-qg2g-g9w3-m5h8
    title: 'CVE-2026-58197: github.com/stacklok/toolhive'
    publisher: GitHub Advisory Database and upstream maintainers
    url: https://github.com/advisories/GHSA-qg2g-g9w3-m5h8
    source_type: advisory
    published_date: '2026-09-18'
    topics:
    - mcp
    - agent-security
    supports:
    - A compromised MCP container using the default permissive network profile can reach host services
      and unauthenticated ToolHive control endpoints without escaping the container.
    - 'Advisory metadata lists ToolHive CLI < 0.30.1; ToolHive Studio < 0.38.0; patched: CLI 0.30.1;
