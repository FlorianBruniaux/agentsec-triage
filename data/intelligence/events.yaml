    event_type: vulnerability
    title: Claude Code Action runs MCP servers from a pull request .mcp.json
    summary: The action checked out attacker-controlled PR head branches, read .mcp.json from the working
      directory and enabled all project MCP servers. A pull request carrying a malicious .mcp.json could
      run code on the Actions runner and expose workflow secrets when a privileged user triggered the action
      on that PR.
