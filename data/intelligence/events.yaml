  - id: evt-2026-06-gemini-cli-headless-ci-rce
    event_type: vulnerability
    title: Gemini CLI and its GitHub Action patched pre-sandbox CI execution
    summary: >-
      NVD records that a crafted .gemini/.env file could execute commands on a
      headless CI host before sandbox initialization. The affected version
      floors cover both Gemini CLI and the run-gemini-cli GitHub Action.
    ecosystems: [ci, gemini-cli, github-actions]
    disclosed_date: "2026-06-24"
    status: confirmed
    confidence: confirmed
    source_ids: [nvd-cve-2026-12537]
    related:
      campaign_ids: []
      cve_ids: [CVE-2026-12537]
      technique_ids: [pre-sandbox-configuration-execution]
    detector_coverage:
      status: not_detected
      detector_ids: []
      notes: >-
        AgentSec does not parse Gemini configuration or GitHub Actions for this
        execution path. Upgrade both affected components and review CI trust.

  - id: evt-2026-07-mcp-ruby-sdk-five-advisories
