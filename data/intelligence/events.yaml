    summary: >-
      GitHub Advisory Database records five MCP Ruby SDK vulnerabilities fixed
      in mcp gem 0.23.0. The set covers session ownership, request and line
      limits, DNS-rebinding protection, and session retention.
    ecosystems: [mcp, ruby]
    disclosed_date: "2026-07-30"
    status: confirmed
    confidence: confirmed
    source_ids:
      - github-advisory-cve-2026-67431
      - github-advisory-cve-2026-67432
      - github-advisory-cve-2026-63118
      - github-advisory-cve-2026-63119
      - github-advisory-cve-2026-67430
    related:
      campaign_ids: []
      cve_ids:
        - CVE-2026-67431
        - CVE-2026-67432
        - CVE-2026-63118
        - CVE-2026-63119
        - CVE-2026-67430
      technique_ids: [dns-rebinding, resource-exhaustion, session-hijacking]
    detector_coverage:
