  - id: evt-2026-08-cosnitch-copilot-personal
    event_type: vulnerability
    title: CoSnitch one-click data exfiltration chain disclosed in Microsoft Copilot Personal
    summary: >-
      Varonis Threat Labs disclosed CVE-2026-24301, a chain of three
      vulnerabilities in Microsoft Copilot Personal: an undocumented
      ?autorun=1 URL parameter that executes an attacker-supplied prompt on
      page load, exfiltration of data from connected OAuth apps through
      Copilot's own URL-fetch tool, and persistent memory poisoning via web
      summarization. Microsoft shipped a server-side fix the same day the
      issue was disclosed. Varonis reports no evidence of pre-patch
      exploitation.
    ecosystems: [microsoft-copilot, agent-runtime]
    disclosed_date: "2026-08-18"
    status: confirmed
    confidence: high
    source_ids: [varonis-cosnitch-2026, nvd-cve-2026-24301]
    related:
      campaign_ids: []
      cve_ids: [CVE-2026-24301]
      technique_ids: [url-parameter-autorun, oauth-connector-exfiltration, memory-poisoning]
    detector_coverage:
      status: not_applicable
      detector_ids: []
      notes: >-
        CoSnitch exploits a hosted, server-side Microsoft Copilot Personal
        endpoint reached through a crafted URL, not a repository artifact.
        AgentSec scans a local repository and has no visibility into a
        vendor's hosted web application; the vendor's own server-side patch
        is the only applicable remediation.

  - id: evt-2026-08-siyuan-mcp-asset-upload-path-traversal
    event_type: vulnerability
    title: SiYuan MCP asset.upload path traversal disclosed and patched
    summary: >-
      A repository security advisory and CVE-2026-82233 described a path
      traversal vulnerability in the asset.upload MCP tool shipped by the
      SiYuan note-taking application. Versions before 3.8.1 accepted
      arbitrary absolute file paths without a workspace boundary check, so a
      prompt-injected instruction to the built-in AI agent could copy files
      such as SSH keys or credentials from outside the workspace into the
      asset directory. Fixed in SiYuan 3.8.1.
    ecosystems: [mcp, siyuan]
    disclosed_date: "2026-08-13"
    status: confirmed
    confidence: confirmed
    source_ids: [ghsa-siyuan-asset-upload-2026, nvd-cve-2026-82233]
    related:
      campaign_ids: []
      cve_ids: [CVE-2026-82233]
      technique_ids: [mcp.tool-path-traversal, prompt-injection]
    detector_coverage:
      status: not_detected
      detector_ids: []
      notes: >-
        The flaw lives inside the SiYuan desktop application's own MCP tool
        implementation, not in a scanned repository's configuration or
        dependency manifest. AgentSec scans a local repository and does not
        analyze third-party desktop application binaries or their bundled
        MCP tool code, so no repository-shaped detector applies.

  - id: evt-2026-08-mcp-php-sdk-sse-buffer-dos
    event_type: vulnerability
    title: Official MCP PHP SDK unbounded SSE buffer denial-of-service disclosed and patched
    summary: >-
      A GitHub security advisory and CVE-2026-53965 described an unbounded
      in-memory buffer in the HttpTransport component of the official Model
      Context Protocol PHP SDK (Composer package mcp/sdk). Versions 0.5.0
      through 0.7.0 appended every incoming Server-Sent Events chunk to a
      buffer with no upper bound and only flushed it on the SSE event
      delimiter, so a malicious, compromised, or man-in-the-middle MCP
      server that withheld the delimiter could exhaust the client process's
      memory and deny service. Fixed in mcp/sdk 0.7.1.
    ecosystems: [mcp, php, composer]
    disclosed_date: "2026-08-25"
    status: confirmed
    confidence: confirmed
    source_ids: [github-ghsa-mcp-php-sdk-sse-2026, nvd-cve-2026-53965]
    related:
      campaign_ids: []
      cve_ids: [CVE-2026-53965]
      technique_ids: [mcp.unbounded-buffer-dos]
    detector_coverage:
      status: not_detected
      detector_ids: []
      notes: >-
        The vulnerable code runs inside the mcp/sdk PHP client library at
        runtime against a remote MCP server response stream. AgentSec scans
        a local repository's static files and configuration and does not
        execute or fuzz a project's PHP dependencies, so no repository-shaped
        detector applies; a version-floor check against mcp/sdk < 0.7.1 in a
        composer.lock is the closest future detector shape but does not
        exist today.
