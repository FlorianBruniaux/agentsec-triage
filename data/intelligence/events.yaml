      Island reported about 7,600 malicious GitHub repositories tied to the
      FakeGit operation, over 800 of them posing as Skills or MCP servers and
      over 600 listings in public registries. Island also reported that
      Claude Code, Gemini and ChatGPT surfaced campaign repositories in its
