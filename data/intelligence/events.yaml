  - id: evt-2026-06-claude-code-webfetch-exfiltration
    event_type: vulnerability
    title: Claude Code patched pre-approved WebFetch domain exfiltration
    summary: >-
      Anthropic reported that a pre-approved Hugging Face hostname allowed
      attacker-controlled paths to act as an out-of-band data channel when
      untrusted content reached Claude Code context. The maintainer identifies
      2.1.163 as the first patched release.
    ecosystems: [claude-code, developer-tools]
    disclosed_date: "2026-06-13"
    status: confirmed
    confidence: confirmed
    source_ids: [anthropic-ghsa-fg94-h982-f3mm]
    related:
      campaign_ids: []
      cve_ids: [CVE-2026-54316]
      technique_ids: [trusted-domain-exfiltration]
    detector_coverage:
      status: not_detected
      detector_ids: []
      notes: >-
        AgentSec does not inspect Claude Code versions, WebFetch allowlists, or
