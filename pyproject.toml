[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentsec-triage"
version = "0.1.0a0"
description = "Deterministic repository triage for documented developer and coding-agent attacks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License decision pending before public release" }
authors = [{ name = "Florian Bruniaux" }]
dependencies = []

[project.scripts]
agentsec = "agentsec.cli:entrypoint"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6.0,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentsec"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentsec"]
