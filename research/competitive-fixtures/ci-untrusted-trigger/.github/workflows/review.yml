name: Inert untrusted trigger fixture

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Harmless marker
        run: printf INERT_CI_MARKER
