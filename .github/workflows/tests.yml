name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rebuild schema-validated threat database
        run: python scripts/build_threat_db.py

      - name: Require deterministic generated threat data
        run: git diff --exit-code -- src/agentsec/resources/threat-db.json

      - name: Require current license prose inventory
        run: python scripts/build_license_prose_inventory.py --check

      - name: Rebuild response playbooks
        run: python scripts/build_response_playbooks.py

      - name: Require deterministic response playbooks
        run: git diff --exit-code -- docs/response-playbooks src/agentsec/resources/response-playbooks.json

      - name: Rebuild security intelligence documents
        run: python scripts/build_intelligence_docs.py

      - name: Require deterministic generated intelligence
        run: git diff --exit-code -- docs/SECURITY-INTELLIGENCE.md docs/SECURITY-TIMELINE.md src/agentsec/resources/security-intelligence.json

      - name: Rebuild public security feed
        run: python scripts/build_security_feed.py

      - name: Require deterministic public security feed
        run: git diff --exit-code -- exports/security-feed.v1.json

      - name: Require current scan-result schema digest
        run: python scripts/build_scan_schema_digest.py --check

      - name: Check Markdown style markers
        run: python scripts/check_markdown_style.py .

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy, including release scripts
        run: mypy src scripts

      - name: Tests and coverage threshold without package index
        if: runner.os == 'Linux'
        env:
          PIP_NO_INDEX: "1"
        run: pytest --cov=agentsec --cov-report=term-missing

      - name: Cross-platform tests without package index
        if: runner.os != 'Linux'
        env:
          PIP_NO_INDEX: "1"
        run: pytest

      - name: Build wheel and source distribution without package index
        env:
          PIP_NO_INDEX: "1"
        run: python -m build --no-isolation

      - name: Verify honest self-scan and detector fixtures
        shell: bash
        run: |
          set +e
          agentsec scan . --format json --redact > self-scan.json
          self_scan_status=$?
          agentsec scan tests/fixtures/lockfiles --format json > unsupported-scan.json
          unsupported_scan_status=$?
          agentsec scan tests/fixtures/shai_hulud/positive --format json > positive-scan.json
          positive_scan_status=$?
          agentsec scan tests/fixtures/shai_hulud/negative --format json > negative-scan.json
          negative_scan_status=$?
          set -e
          test "${self_scan_status}" -eq 2
          test "${unsupported_scan_status}" -eq 2
          test "${positive_scan_status}" -eq 1
          test "${negative_scan_status}" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path

          self_scan = json.loads(Path("self-scan.json").read_text(encoding="utf-8"))
          assert self_scan["complete"] is False
          assert self_scan["diagnostics"]

          unsupported = json.loads(
              Path("unsupported-scan.json").read_text(encoding="utf-8")
          )
          assert unsupported["complete"] is False
          assert any(
              item["path"].replace("\\", "/").endswith(
                  "bun.lockb"
              )
              and item["message"] == "Unsupported binary Bun lockfile format"
              for item in unsupported["diagnostics"]
          )

          positive = json.loads(Path("positive-scan.json").read_text(encoding="utf-8"))
          assert positive["complete"] is True
          assert positive["diagnostics"] == []
          assert any(item["severity"] == "critical" for item in positive["findings"])

          negative = json.loads(Path("negative-scan.json").read_text(encoding="utf-8"))
          assert negative["complete"] is True
          assert negative["diagnostics"] == []
          assert all(item["severity"] != "critical" for item in negative["findings"])
          PY

      - name: Install wheel without dependencies and run doctor
        shell: bash
        run: |
          python -m venv .package-check
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            source .package-check/Scripts/activate
          else
            source .package-check/bin/activate
          fi
          wheel="$(find dist -name '*.whl' -print -quit)"
          test -n "${wheel}"
          PIP_NO_INDEX=1 python -m pip install --no-deps --no-index "${wheel}"
          agentsec doctor
          python -m agentsec doctor

  consumer-sync:
    name: Guide and landing feed mirrors
    runs-on: ubuntu-latest
    steps:
      - name: Check out AgentSec
        uses: actions/checkout@v7

      - name: Clone public consumers
        run: |
          git clone --depth 1 https://github.com/FlorianBruniaux/claude-code-ultimate-guide.git ../claude-code-ultimate-guide
          git clone --depth 1 https://github.com/FlorianBruniaux/claude-code-ultimate-guide-landing.git ../claude-code-ultimate-guide-landing

      - name: Reject feed drift
        run: |
          python scripts/sync_security_feed.py --check \
            --guide-root ../claude-code-ultimate-guide \
            --landing-root ../claude-code-ultimate-guide-landing
