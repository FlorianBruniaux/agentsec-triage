name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rebuild schema-validated threat database
        run: python scripts/build_threat_db.py

      - name: Require deterministic generated threat data
        run: git diff --exit-code -- src/agentsec/resources/threat-db.json

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy, including release scripts
        run: mypy src scripts

      - name: Tests and coverage threshold
        run: pytest --cov=agentsec --cov-report=term-missing

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel without dependencies and run doctor
        shell: bash
        run: |
          python -m venv .package-check
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            source .package-check/Scripts/activate
          else
            source .package-check/bin/activate
          fi
          wheel="$(find dist -name '*.whl' -print -quit)"
          test -n "${wheel}"
          python -m pip install --no-deps "${wheel}"
          agentsec doctor

